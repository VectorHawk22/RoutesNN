<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Маршрут — Маршруты Нижнего Новгорода</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container site-header__inner">
    <a href="index.html" class="logo">
      <span class="logo__mark">НН</span>
      <span>Маршруты Нижнего Новгорода</span>
    </a>
    <nav class="site-nav"><a href="index.html">← Все маршруты</a></nav>
  </div>
</header>

<main class="route-page">
  <div class="container">
    <div id="route-loading" class="loading">Загружаем маршрут…</div>

    <div id="route-content" hidden>
      <div class="route-hero">
        <div id="route-map" class="route-hero__map"></div>
        <aside class="route-hero__panel">
          <span class="badge" id="route-badge"></span>
          <h1 id="route-title"></h1>
          <p class="route-district" id="route-district"></p>

          <div class="route-meta">
            <div><strong id="route-length">—</strong><span>км</span></div>
            <div><strong id="route-total">—</strong><span>из 12</span></div>
          </div>

          <div class="scores" id="route-scores"></div>
        </aside>
      </div>

      <div class="route-body">
        <article class="route-text">
          <h2>Как проходит маршрут</h2>
          <p id="route-description"></p>

          <h2>Плюсы</h2>
          <p id="route-pros"></p>

          <h2>Сложности</h2>
          <p id="route-cons"></p>

          <h2>Достопримечательности</h2>
          <p id="route-sights"></p>
        </article>

        <aside class="route-gallery">
          <h2>Фотографии</h2>
          <div class="gallery" id="route-gallery"></div>
        </aside>
      </div>
    </div>
  </div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/route.js"></script>
</body>
</html>
